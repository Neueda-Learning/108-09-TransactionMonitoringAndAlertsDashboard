version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: tm-mysql
    environment:
      MYSQL_DATABASE: transaction_monitoring
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8083:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tm-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transaction_monitoring?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
      SDN_API_ENABLED: "false"
      SDN_LOCAL_LIST_ENABLED: "true"
    ports:
      - "8082:8080"

  frontend:
    image: node:20-alpine
    container_name: tm-frontend
    working_dir: /app
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: http://10.9.70.176:8082/api
      PORT: "8081"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "8081:8081"

volumes:
  mysql_data:
