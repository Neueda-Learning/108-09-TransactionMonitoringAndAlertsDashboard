version: "3.9"
services:
  bankdb:
    image: mysql:8
    container_name: bankdb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: bankdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  kk-04-rest:
    build: .
    container_name: kk-04-rest
    depends_on:
      - bankdb
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  kk-04-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kk-04-frontend
    depends_on:
      - kk-04-rest
    ports:
      - "8081:80"

volumes:
  mysql-data: