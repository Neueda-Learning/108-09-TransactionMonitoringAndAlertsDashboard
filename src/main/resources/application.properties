spring.application.name=transaction-monitoring-system
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/transaction_monitoring?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql
server.port=${SERVER_PORT:8082}
 
# SDN screening API integration
sdn.api.enabled=${SDN_API_ENABLED:false}
sdn.api.url=${SDN_API_URL:https://api.sanctions.network/search}
sdn.api.query-param=${SDN_API_QUERY_PARAM:name}
sdn.api.api-key=${SDN_API_KEY:REPLACE_WITH_SANCTIONS_NETWORK_API_KEY}
sdn.api.api-key-header=${SDN_API_KEY_HEADER:Authorization}
sdn.api.timeout-ms=${SDN_API_TIMEOUT_MS:2500}
sdn.api.fail-open=${SDN_API_FAIL_OPEN:true}
 
# Internal SDN list screening (primary)
sdn.local-list.enabled=${SDN_LOCAL_LIST_ENABLED:true}
sdn.local-list.file=${SDN_LOCAL_LIST_FILE:sdn-payee-list.txt}
